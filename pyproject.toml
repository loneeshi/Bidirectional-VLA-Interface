[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidirectional-vla-interface"
version = "0.1.0"
description = "A constrained VLM-to-skill interface baseline for mobile manipulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66"]
anthropic = ["anthropic>=0.49"]

[tool.setuptools.packages.find]
where = ["src"]

