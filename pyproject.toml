[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidirectional-vla-interface"
version = "0.1.0"
description = "A constrained VLM-to-skill interface baseline for mobile manipulation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bvi-eval = "bvi.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.66"]
anthropic = ["anthropic>=0.49"]
eval = ["numpy>=1.24", "Pillow>=10"]
bridge = ["paramiko>=3.5"]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
