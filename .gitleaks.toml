title = "Bidirectional-VLA-Interface secret-scan exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "The public environment template contains empty credential placeholders"
paths = [
  '''^\.env\.example$''',
]

[[rules.allowlists]]
description = "Historical experiment manifests record source-file SHA-256 values, not credentials"
regexTarget = "line"
regexes = [
  '''^\s*"[^"\r\n]*(?:sapien_env|same_key_confirmation)\.py"\s*:\s*"[0-9a-f]{64}",?\s*$''',
]
